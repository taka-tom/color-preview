<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>カラー選択プレビュー</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- カラー選択 -->
  <section class="color-selector">

    <h1>サイトカラーを選択</h1>

    <p>お好みの雰囲気を選んでください</p>

    <div class="color-buttons">



      <button data-color="natural">
        ナチュラル
      </button>

      <button data-color="fresh">
        爽やか
      </button>

      <button data-color="chic">
        シック
      </button>

      <button data-color="japanese">
        和モダン
      </button>

      <button data-color="warm">
        あたたかみ
      </button>

      <button data-color="luxury">
        高級感
      </button>

</div>

<div class="color-preview">

  <div class="color-sample">
    <span></span>
    <p>背景</p>
    <small>#F7F5F0</small>
  </div>

  <div class="color-sample">
    <span></span>
    <p>文字</p>
    <small>#3D3A34</small>
  </div>

  <div class="color-sample">
    <span></span>
    <p>メイン</p>
    <small>#8B6F47</small>
  </div>

  <div class="color-sample">
    <span></span>
    <p>サブ</p>
    <small>#E8DFD2</small>
  </div>



    </div>

  </section>


  <!-- サイトプレビュー -->
  <main class="preview">

    <header class="site-header">
      <div class="site-logo">
        YOUR SHOP
      </div>

      <nav>
        <a href="#">HOME</a>
        <a href="#">MENU</a>
        <a href="#">ABOUT</a>
        <a href="#">ACCESS</a>
      </nav>
    </header>


    <section class="hero">

      <div class="hero-content">

        <p class="hero-subtitle">
          WELCOME TO OUR WEBSITE
        </p>

        <h2>
          YOUR SHOP
        </h2>

        <p>
          あなたのお店の魅力を伝える<br>
          シンプルで美しいウェブサイト
        </p>

        <a href="#" class="button">
          MENU
        </a>

      </div>

    </section>


    <section class="contents">

      <h2>ABOUT</h2>

      <p>
        お店のこだわりや想いなどを<br>
        ここに掲載できます。
      </p>


      <div class="sample-cards">

        <div class="card">
          <h3>MENU</h3>
          <p>おすすめメニュー</p>
        </div>

        <div class="card">
          <h3>CONCEPT</h3>
          <p>お店のコンセプト</p>
        </div>

        <div class="card">
          <h3>ACCESS</h3>
          <p>店舗へのアクセス</p>
        </div>

      </div>

    </section>


    <footer>
      <p>YOUR SHOP</p>
    </footer>

  </main>


  <script src="script.js"></script>

</body>

</html>
