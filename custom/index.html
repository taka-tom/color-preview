<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>カラー指定プレビュー</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- カラー指定エリア -->
  <section class="color-selector">

    <h1>サイトカラーを指定</h1>

    <p>4つのカラーを指定してください</p>

    <div class="color-inputs">

      <div class="color-input">
        <label for="bgColor">背景</label>

        <div class="input-row">
          <input
            type="color"
            id="bgColorPicker"
            value="#F7F5F0"
          >

          <input
            type="text"
            id="bgColor"
            value="#F7F5F0"
            maxlength="7"
          >
        </div>
      </div>


      <div class="color-input">
        <label for="textColor">文字</label>

        <div class="input-row">
          <input
            type="color"
            id="textColorPicker"
            value="#333333"
          >

          <input
            type="text"
            id="textColor"
            value="#333333"
            maxlength="7"
          >
        </div>
      </div>


      <div class="color-input">
        <label for="accentColor">アクセント</label>

        <div class="input-row">
          <input
            type="color"
            id="accentColorPicker"
            value="#8B6F47"
          >

          <input
            type="text"
            id="accentColor"
            value="#8B6F47"
            maxlength="7"
          >
        </div>
      </div>


      <div class="color-input">
        <label for="subColor">サブ</label>

        <div class="input-row">
          <input
            type="color"
            id="subColorPicker"
            value="#E8DFD2"
          >

          <input
            type="text"
            id="subColor"
            value="#E8DFD2"
            maxlength="7"
          >
        </div>
      </div>

    </div>


    <!-- 色見本 -->
    <div class="color-preview">

      <div class="color-sample">
        <span id="bgSample"></span>
        <p>背景</p>
        <small id="bgCode">#F7F5F0</small>
      </div>

      <div class="color-sample">
        <span id="textSample"></span>
        <p>文字</p>
        <small id="textCode">#333333</small>
      </div>

      <div class="color-sample">
        <span id="accentSample"></span>
        <p>アクセント</p>
        <small id="accentCode">#8B6F47</small>
      </div>

      <div class="color-sample">
        <span id="subSample"></span>
        <p>サブ</p>
        <small id="subCode">#E8DFD2</small>
      </div>

    </div>

  </section>


  <!-- サイトプレビュー -->
  <main class="preview">

    <header class="site-header">

      <div class="site-logo">
        YOUR SHOP
      </div>

      <nav>
        <a href="#">HOME</a>
        <a href="#">MENU</a>
        <a href="#">ABOUT</a>
        <a href="#">ACCESS</a>
      </nav>

    </header>


    <section class="hero">

      <div class="hero-content">

        <p class="hero-subtitle">
          WELCOME TO OUR WEBSITE
        </p>

        <h2>
          YOUR SHOP
        </h2>

        <p>
          あなたのお店の魅力を伝える<br>
          シンプルで美しいウェブサイト
        </p>

        <a href="#" class="button">
          MENU
        </a>

      </div>

    </section>


    <section class="contents">

      <h2>ABOUT</h2>

      <p>
        お店のこだわりや想いなどを<br>
        ここに掲載できます。
      </p>


      <div class="sample-cards">

        <div class="card">
          <h3>MENU</h3>
          <p>おすすめメニュー</p>
        </div>

        <div class="card">
          <h3>CONCEPT</h3>
          <p>お店のコンセプト</p>
        </div>

        <div class="card">
          <h3>ACCESS</h3>
          <p>店舗へのアクセス</p>
        </div>

      </div>

    </section>


    <footer>
      <p>YOUR SHOP</p>
    </footer>

  </main>


  <script src="script.js"></script>

</body>

</html>
