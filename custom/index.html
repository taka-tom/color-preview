<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>サイトカラーを設定</title>

  <link rel="stylesheet" href="style.css">

</head>


<body>


  <!-- カラー設定 -->

  <section class="color-selector">

    <h1>サイトカラーを設定</h1>

    <p>
      背景・文字・メイン・サブの色を
      自由に選んでください
    </p>


    <!-- 背景 -->

    <div class="color-setting">

      <h2>背景</h2>

      <div class="palette-row">

        <button
          class="palette-button selected"
          data-color="#FFFFFF"
          style="background:#FFFFFF;">
        </button>

        <button
          class="palette-button"
          data-color="#F7F5F0"
          style="background:#F7F5F0;">
        </button>

        <button
          class="palette-button"
          data-color="#F4F1EA"
          style="background:#F4F1EA;">
        </button>

        <button
          class="palette-button"
          data-color="#FFF7EF"
          style="background:#FFF7EF;">
        </button>

        <button
          class="palette-button"
          data-color="#F4F9F8"
          style="background:#F4F9F8;">
        </button>

        <button
          class="palette-button"
          data-color="#F4F4F4"
          style="background:#F4F4F4;">
        </button>

      </div>

      <p class="selected-color">
        選択中：
        <span id="bg-value">#FFFFFF</span>
      </p>

    </div>


    <!-- プレビュー -->

    <div class="preview">

      <header>
        YOUR SHOP
      </header>

      <nav>
        HOME　 ABOUT　 MENU　 ACCESS
      </nav>

      <section class="hero">

        <h2>
          YOUR SHOP
        </h2>

        <p>
          心地よい時間を過ごせる場所
        </p>

        <button>
          MENU
        </button>

      </section>


      <section class="content">

        <h2>ABOUT</h2>

        <p>
          お店の紹介文がここに入ります。
        </p>

      </section>


      <footer>
        © YOUR SHOP
      </footer>

    </div>

  </section>


  <script src="script.js"></script>

</body>

</html>
