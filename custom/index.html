<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>カラー指定プレビュー</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>


  <!-- =========================
       カラー指定エリア
  ========================== -->

<section class="color-settings">

  <h1>サイトカラーを指定</h1>

  <p>4つのカラーを指定してください</p>

  <div class="color-selector">

    <!-- =========================
         背景カラー
    ========================== -->

    <div class="color-control">

      <h2>背景</h2>

      <div class="color-picker-area">
        
<div class="color-grid" id="bgGrid">
  <div class="color-grid-cursor" id="bgGridCursor"></div>
</div>

<div class="hue-spectrum" id="bgHue">
  <div class="hue-cursor" id="bgHueCursor"></div>
</div>

       
        <div class="lightness-slider">
          <input
            type="range"
            id="bgLightness"
            min="0"
            max="100"
            value="95"
          >
        </div>

      </div>


      <div class="color-code-row">

        <input
          type="color"
          id="bgColorPicker"
          value="#F7F5F0"
        >

        <input
          type="text"
          id="bgColor"
          value="#F7F5F0"
          maxlength="7"
        >

      </div>


      <div class="color-result">

        <span id="bgSample"></span>

        <div>
          <strong>背景</strong>
          <small id="bgCode">#F7F5F0</small>
        </div>

      </div>

    </div>



    <!-- =========================
         文字カラー
    ========================== -->

    <div class="color-control">

      <h2>文字</h2>

      <div class="color-picker-area">

<div class="color-grid" id="textGrid">
  <div class="color-grid-cursor" id="textGridCursor"></div>
</div>

<div class="hue-spectrum" id="textHue">
  <div class="hue-cursor" id="textHueCursor"></div>
</div>

        <div class="lightness-slider">
          <input
            type="range"
            id="textLightness"
            min="0"
            max="100"
            value="20"
          >
        </div>

      </div>


      <div class="color-code-row">

        <input
          type="color"
          id="textColorPicker"
          value="#333333"
        >

        <input
          type="text"
          id="textColor"
          value="#333333"
          maxlength="7"
        >

      </div>


      <div class="color-result">

        <span id="textSample"></span>

        <div>
          <strong>文字</strong>
          <small id="textCode">#333333</small>
        </div>

      </div>

    </div>



    <!-- =========================
         アクセントカラー
    ========================== -->

    <div class="color-control">

      <h2>アクセント</h2>

      <div class="color-picker-area">

 <div class="color-grid" id="accentGrid">
  <div class="color-grid-cursor" id="accentGridCursor"></div>
</div>

<div class="hue-spectrum" id="accentHue">
  <div class="hue-cursor" id="accentHueCursor"></div>
</div>

        <div class="lightness-slider">
          <input
            type="range"
            id="accentLightness"
            min="0"
            max="100"
            value="40"
          >
        </div>

      </div>


      <div class="color-code-row">

        <input
          type="color"
          id="accentColorPicker"
          value="#8B6F47"
        >

        <input
          type="text"
          id="accentColor"
          value="#8B6F47"
          maxlength="7"
        >

      </div>


      <div class="color-result">

        <span id="accentSample"></span>

        <div>
          <strong>アクセント</strong>
          <small id="accentCode">#8B6F47</small>
        </div>

      </div>

    </div>



    <!-- =========================
         サブカラー
    ========================== -->

    <div class="color-control">

      <h2>サブ</h2>

      <div class="color-picker-area">

<div class="color-grid" id="subGrid">
  <div class="color-grid-cursor" id="subGridCursor"></div>
</div>

<div class="hue-spectrum" id="subHue">
  <div class="hue-cursor" id="subHueCursor"></div>
</div>

        <div class="lightness-slider">
          <input
            type="range"
            id="subLightness"
            min="0"
            max="100"
            value="88"
          >
        </div>

      </div>


      <div class="color-code-row">

        <input
          type="color"
          id="subColorPicker"
          value="#E8DFD2"
        >

        <input
          type="text"
          id="subColor"
          value="#E8DFD2"
          maxlength="7"
        >

      </div>


      <div class="color-result">

        <span id="subSample"></span>

        <div>
          <strong>サブ</strong>
          <small id="subCode">#E8DFD2</small>
        </div>

      </div>

    </div>

  </section>

  </section>



  <!-- =========================
       サイトプレビュー
  ========================== -->

  <main class="preview">


    <header class="site-header">

      <div class="site-logo">
        YOUR SHOP
      </div>

      <nav>
        <a href="#">HOME</a>
        <a href="#">MENU</a>
        <a href="#">ABOUT</a>
        <a href="#">ACCESS</a>
      </nav>

    </header>



    <section class="hero">

      <div class="hero-content">

        <p class="hero-subtitle">
          WELCOME TO OUR WEBSITE
        </p>

        <h2>
          YOUR SHOP
        </h2>

        <p>
          あなたのお店の魅力を伝える<br>
          シンプルで美しいウェブサイト
        </p>

        <a href="#" class="button">
          MENU
        </a>

      </div>

    </section>



    <section class="contents">

      <h2>ABOUT</h2>

      <p>
        お店のこだわりや想いなどを<br>
        ここに掲載できます。
      </p>


      <div class="sample-cards">

        <div class="card">

          <h3>MENU</h3>

          <p>
            おすすめメニュー
          </p>

        </div>


        <div class="card">

          <h3>CONCEPT</h3>

          <p>
            お店のコンセプト
          </p>

        </div>


        <div class="card">

          <h3>ACCESS</h3>

          <p>
            店舗へのアクセス
          </p>

        </div>

      </div>

    </section>



    <footer>

      <p>
        YOUR SHOP
      </p>

    </footer>


  </main>



  <script src="script.js"></script>

</body>

</html>
